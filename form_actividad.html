<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informar Actividad</title>
</head>
<body>
    <form action="#" method="post">
        <h3>Información de lugar</h3>
        <!-- Region(menu seleccion),Comuna,Sector -->
        <label for="region">Región:</label>
        <select id="region" name="region">
            <option value="region1">Región 1</option>
            <option value="region2">Región 2</option>
            <option value="region3">Región 3</option>
            <option value="region4">Región 4</option>
            <option value="region5">Región 5</option>
        </select>
        <br><br>
        <label for="comuna">Comuna:</label>
        <input type="text" id="comuna" name="comuna" required>
        <br><br>
        <label for="sector">Sector:</label>
        <input type="text" id="sector" name="sector" required>
        <br><br>

        <h3>Datos del organizador</h3>
        <!-- Nombre,email,numero celular, contactar por(menu selecion rrss) -->
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>
        <label for="numero">Número celular:</label>
        <input type="tel" id="numero" name="numero" required>
        <br><br>
        <label for="contactar">Contactar por:</label>
        <select id="contactar" name="contactar">
            <option value="whatsapp">WhatsApp</option>
            <option value="email">Email</option>
            <option value="telefono">Teléfono</option>
            <option value="rrss">Redes Sociales</option>
        </select>
        <br><br>
        <h3>Información de la Actividad</h3>
        <!-- dia hora inicio y fin, descripcion,tema y foto -->
        <label for="hora_inicio">Fecha de inicio:</label>
        <input type="date" id="fecha_inicio" name="fecha_inicio" required>
        <input type="time" id="hora_inicio" name="hora_inicio" required>
        <br><br>
        <label for="hora_fin">Fecha de fin:</label>
        <input type="date" id="fecha_fin" name="fecha_fin" required>
        <input type="time" id="hora_fin" name="hora_fin" required>
        <br><br>
        <label for="descripcion">Descripción:</label>
        <textarea id="descripcion" name="descripcion" rows="10" cols="50" required></textarea>
        <br><br>
        <label for="tema">Tema:</label>
        <select id="tema" name="tema">
            <option value="tema1">Tema 1</option>
            <option value="tema2">Tema 2</option>
            <option value="tema3">Tema 3</option>
            <option value="tema4">Tema 4</option>
            <option value="tema5">Tema 5</option>
        </select>
        <br><br>
        <label for="foto">Foto:</label>
        <input type="file" id="foto" name="foto" accept="image/*" required>
        <br><br>


    </form>
</body>
</html>
